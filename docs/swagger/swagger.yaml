basePath: /
definitions:
  domain.Comanda:
    properties:
      abertaEm:
        type: string
      codigoFisico:
        type: string
      fechadaEm:
        type: string
      id:
        type: string
      status:
        $ref: '#/definitions/domain.StatusComanda'
      tableID:
        type: string
      tenantID:
        type: string
    type: object
  domain.Discount:
    properties:
      aplicadoEm:
        type: string
      aplicadoPor:
        type: string
      comandaID:
        type: string
      id:
        type: string
      motivo:
        type: string
      tenantID:
        type: string
      tipo:
        $ref: '#/definitions/domain.TipoDesconto'
      valor:
        format: float64
        type: number
    type: object
  domain.OrderItem:
    properties:
      comandaID:
        type: string
      id:
        type: string
      lancadoEm:
        type: string
      lancadoPor:
        type: string
      motivoRemocao:
        type: string
      pesoKg:
        description: usado para itens de peso (peso líquido, já descontada a tara)
        format: float64
        type: number
      productID:
        type: string
      quantidade:
        description: usado para itens unitários
        format: float64
        type: number
      removidoEm:
        type: string
      removidoPor:
        description: |-
          Preenchidos só quando Status != ativo (US-10/US-12) — o lançamento
          original nunca é apagado, só marcado.
        type: string
      status:
        $ref: '#/definitions/domain.StatusOrderItem'
      tenantID:
        type: string
      valor:
        format: float64
        type: number
    type: object
  domain.StatusComanda:
    enum:
    - disponivel
    - em_uso
    - paga
    - cancelada
    type: string
    x-enum-varnames:
    - StatusDisponivel
    - StatusEmUso
    - StatusPaga
    - StatusCancelada
  domain.StatusOrderItem:
    enum:
    - ativo
    - removido
    - estornado
    type: string
    x-enum-varnames:
    - StatusItemAtivo
    - StatusItemRemovido
    - StatusItemEstornado
  domain.TipoDesconto:
    enum:
    - valor_fixo
    - percentual
    type: string
    x-enum-varnames:
    - DescontoValorFixo
    - DescontoPercentual
  handler.abrirComandaRequest:
    properties:
      table_id:
        type: string
    type: object
  handler.aplicarDescontoRequest:
    properties:
      motivo:
        type: string
      tipo:
        type: string
      valor:
        type: number
    type: object
  handler.cancelarComandaRequest:
    properties:
      motivo:
        type: string
    type: object
  handler.fecharPagamentoRequest:
    properties:
      comanda_ids:
        items:
          type: string
        type: array
      pagamentos:
        items:
          $ref: '#/definitions/handler.pagamentoParcialRequest'
        type: array
    type: object
  handler.fecharPagamentoResponse:
    properties:
      payment_ids:
        items:
          type: string
        type: array
    type: object
  handler.lancarItemRequest:
    properties:
      product_id:
        type: string
      quantidade:
        type: number
    type: object
  handler.loginRequest:
    properties:
      login:
        type: string
      senha:
        type: string
    type: object
  handler.loginResponse:
    properties:
      token:
        type: string
    type: object
  handler.motivoRequest:
    properties:
      motivo:
        type: string
    type: object
  handler.pagamentoParcialRequest:
    properties:
      metodo:
        type: string
      valor:
        type: number
    type: object
  handler.registrarPesoRequest:
    properties:
      peso_bruto:
        type: number
      product_id:
        type: string
    type: object
  handler.transferirMesaRequest:
    properties:
      table_id:
        type: string
    type: object
info:
  contact: {}
  description: Sistema de comandas multi-tenant (churrascaria como primeira instância).
    Ver CLAUDE.md e docs/merka-planejamento.md para o contexto completo do domínio.
  title: Merka API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Valida login/senha e devolve um JWT contendo user_id, tenant_id
        e role_id, usado nas demais rotas via header Authorization: Bearer <token>.'
      parameters:
      - description: Credenciais
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.loginResponse'
        "400":
          description: corpo da requisição inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: login ou senha inválidos
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Autenticar usuário
      tags:
      - auth
  /comandas/{codigo}/abrir:
    post:
      consumes:
      - application/json
      description: 'Porteiro escaneia/seleciona a comanda física e o sistema a marca
        como "em_uso", associando-a opcionalmente a uma mesa. Falha se a comanda não
        estiver com status "disponivel". Requer autenticação (Authorization: Bearer
        <token>).'
      parameters:
      - description: Código físico da comanda (código de barras/QR)
        in: path
        name: codigo
        required: true
        type: string
      - description: Mesa a associar à comanda (opcional)
        in: body
        name: body
        schema:
          $ref: '#/definitions/handler.abrirComandaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Comanda'
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: comanda não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: comanda não está disponível (em uso, paga ou cancelada)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Entregar comanda zerada ao cliente (US-07)
      tags:
      - comandas
  /comandas/{codigo}/liberar:
    post:
      description: Porteiro escaneia a comanda na saída; se estiver paga (sem saldo
        devedor), o sistema libera de volta pro estoque (status volta a "disponivel").
        Se ainda tiver saldo pendente, bloqueia com erro claro.
      parameters:
      - description: Código físico da comanda
        in: path
        name: codigo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Comanda'
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: comanda não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: comanda ainda não foi paga
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Receber comanda na saída e validar zeramento (US-08)
      tags:
      - comandas
  /comandas/{id}/cancelar:
    post:
      consumes:
      - application/json
      description: Restrito a Gestor/Admin Super (permissão "cancelar_comanda"). Zera
        todos os itens/pesos lançados (marcados como removidos, nunca apagados), marca
        a comanda como cancelada e a libera de volta pro estoque. Exige motivo.
      parameters:
      - description: ID da comanda
        in: path
        name: id
        required: true
        type: string
      - description: Motivo do cancelamento
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.cancelarComandaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Comanda'
        "400":
          description: motivo obrigatório
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: usuário sem permissão para esta ação
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: comanda não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: comanda não está em uso
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cancelar comanda totalmente (US-15)
      tags:
      - comandas
  /comandas/{id}/desconto:
    post:
      consumes:
      - application/json
      description: Restrito a Gestor, Admin Super ou Caixa (permissão "aplicar_desconto").
        Tipo "valor_fixo" ou "percentual", sempre com motivo — bloqueia se o desconto
        resultar em total negativo.
      parameters:
      - description: ID da comanda
        in: path
        name: id
        required: true
        type: string
      - description: Tipo, valor e motivo do desconto
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.aplicarDescontoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Discount'
        "400":
          description: motivo obrigatório ou tipo inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: usuário sem permissão para esta ação
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: desconto resultaria em valor negativo
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Aplicar desconto manual (US-17)
      tags:
      - comandas
  /comandas/{id}/itens:
    post:
      consumes:
      - application/json
      description: Garçom lança um item do cardápio (bebida, sobremesa, etc.) na comanda.
        Se a comanda já não aceitar lançamento (paga/cancelada), o lançamento é rejeitado
        e um alerta é gravado em sync_alerts para o Gestor (conflito de sincronização).
      parameters:
      - description: ID da comanda
        in: path
        name: id
        required: true
        type: string
      - description: Produto e quantidade
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.lancarItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.OrderItem'
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: comanda ou produto não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: comanda já finalizada — lançamento rejeitado, alerta gravado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lançar item unitário na comanda (US-11)
      tags:
      - comandas
  /comandas/{id}/mesa:
    patch:
      consumes:
      - application/json
      description: Permitida a qualquer perfil autenticado (sem checagem de permissão
        granular, por decisão do planejamento) — mantém todos os itens/pesos já lançados
        intactos.
      parameters:
      - description: ID da comanda
        in: path
        name: id
        required: true
        type: string
      - description: Nova mesa
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.transferirMesaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Comanda'
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: comanda ou mesa não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: comanda não está em uso
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Transferir comanda entre mesas (US-16)
      tags:
      - comandas
  /comandas/{id}/pesos:
    post:
      consumes:
      - application/json
      description: Balança lê o peso bruto do prato; o backend calcula (peso_bruto
        - tara) * preco_por_kg e lança em order_items. Se a comanda já não aceitar
        lançamento (paga/cancelada), o lançamento é rejeitado e um alerta é gravado
        em sync_alerts para o Gestor (conflito de sincronização).
      parameters:
      - description: ID da comanda
        in: path
        name: id
        required: true
        type: string
      - description: Produto pesado e peso bruto lido
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.registrarPesoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.OrderItem'
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: comanda ou produto não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: comanda já finalizada — lançamento rejeitado, alerta gravado
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Registrar peso de item na comanda (US-09)
      tags:
      - comandas
  /order-items/{id}/estornar:
    patch:
      consumes:
      - application/json
      description: 'Operador de Balança remove um lançamento de peso já feito (ex:
        cliente foi e voltou pra repetir). O registro original é preservado — muda
        só o status pra "estornado". Exige motivo.'
      parameters:
      - description: ID do order_item
        in: path
        name: id
        required: true
        type: string
      - description: Motivo do estorno
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.motivoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.OrderItem'
        "400":
          description: motivo obrigatório
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: usuário sem permissão para esta ação
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: item não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: item já foi removido ou estornado anteriormente
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Estornar registro de peso (US-10)
      tags:
      - order-items
  /order-items/{id}/remover:
    patch:
      consumes:
      - application/json
      description: Garçom remove um item unitário lançado por engano ou a pedido do
        cliente. O registro original é preservado — muda só o status pra "removido".
        Exige motivo.
      parameters:
      - description: ID do order_item
        in: path
        name: id
        required: true
        type: string
      - description: Motivo da remoção
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.motivoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.OrderItem'
        "400":
          description: motivo obrigatório
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: usuário sem permissão para esta ação
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: item não encontrado
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: item já foi removido ou estornado anteriormente
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remover item lançado da comanda (US-12)
      tags:
      - order-items
  /pagamentos:
    post:
      consumes:
      - application/json
      description: Soma o total ativo (itens + pesos, excluindo removidos/estornados)
        das comandas informadas — que podem ser N comandas de uma mesma mesa — e confere
        contra a soma dos pagamentos parciais informados (suporta pagamento misto).
        Se bater, grava um payment por método, liga todas as comandas via payment_comandas
        e marca as comandas como "paga". Não emite nota fiscal ainda (ver TODO no
        usecase para US-14/emissão de NFC-e).
      parameters:
      - description: Comandas a fechar e pagamentos parciais
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.fecharPagamentoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.fecharPagamentoResponse'
        "400":
          description: corpo inválido, método inválido ou soma dos pagamentos não
            bate com o total
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: alguma comanda não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Fechar pagamento de uma ou mais comandas (US-13 + US-14)
      tags:
      - pagamentos
securityDefinitions:
  BearerAuth:
    description: Informe "Bearer <token>" (token obtido em POST /auth/login)
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
