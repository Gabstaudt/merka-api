version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: merka
      POSTGRES_PASSWORD: merka
      POSTGRES_DB: merka
    ports:
      - "5432:5432"
    volumes:
      - merka_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merka -d merka"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://merka:merka@postgres:5432/merka?sslmode=disable
      JWT_SECRET: dev-secret-trocar-em-producao
    ports:
      - "8080:8080"

volumes:
  merka_pgdata:
