version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: merka
      POSTGRES_PASSWORD: merka
      POSTGRES_DB: merka
    ports:
      - "5432:5432"
    volumes:
      - merka_pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merka -d merka"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgres://merka:merka@postgres:5432/merka?sslmode=disable
      JWT_SECRET: dev-secret-trocar-em-producao
      # Certificado digital A1 (ICP-Brasil) usado pra assinar XML de NFC-e
      # (integração direta SEFAZ — ver CLAUDE.md e internal/fiscal/).
      # Nunca hardcoded aqui: os valores vêm do .env local (não versionado)
      # ou do ambiente do host — se não definidos, ficam vazios e o
      # provider real simplesmente não carrega (ver
      # internal/fiscal/certificado.go — ErrCertificadoNaoConfigurado).
      FISCAL_CERT_PATH: ${FISCAL_CERT_PATH:-}
      FISCAL_CERT_SENHA: ${FISCAL_CERT_SENHA:-}
      # mock (padrão) | sefaz — ver .env.example
      FISCAL_PROVIDER: ${FISCAL_PROVIDER:-mock}
      FISCAL_AMBIENTE: ${FISCAL_AMBIENTE:-homologacao}
      FISCAL_SEFAZ_TIMEOUT_SEGUNDOS: ${FISCAL_SEFAZ_TIMEOUT_SEGUNDOS:-8}
    ports:
      - "8080:8080"
    # Descomente e ajuste quando o certificado .pfx estiver disponível —
    # o arquivo do host é montado (read-only) no caminho que
    # FISCAL_CERT_PATH aponta dentro do container. O .pfx em si NUNCA
    # deve ir pro repositório (adicionar ao .gitignore).
    # volumes:
    #   - ${FISCAL_CERT_HOST_PATH}:${FISCAL_CERT_PATH}:ro

volumes:
  merka_pgdata:
