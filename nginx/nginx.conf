# Configuração Nginx de produção — proxy reverso pra API + terminação
# TLS (Let's Encrypt via certbot). Ver docs/deploy.md pro passo a passo
# completo (inclusive por que o certificado precisa existir ANTES do
# nginx conseguir subir com este arquivo — bootstrap via
# scripts/init-letsencrypt.sh).
#
# SEU_DOMINIO precisa ser substituído pelo domínio real antes do deploy
# (scripts/init-letsencrypt.sh faz isso via sed automaticamente a partir
# da variável DOMAIN do .env.prod — não edite manualmente se for usar o
# script).

# Upgrade de conexão só quando o cliente pede (WebSocket, GET /ws) — sem
# este map, forçar "Connection: upgrade" em toda requisição atrapalharia
# o keep-alive normal do HTTP/1.1 nas rotas REST.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Bloco HTTP (porta 80): só serve o desafio ACME do certbot (renovação de
# certificado) e redireciona TUDO o mais pra HTTPS — nunca serve a API
# nem qualquer conteúdo por HTTP puro.
server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Bloco HTTPS (porta 443): termina TLS e faz proxy pra API (serviço
# `api`, porta 8080, só alcançável dentro da rede Docker).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SEU_DOMINIO;

    ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO/privkey.pem;
    # Parâmetros de cifra/protocolo — arquivos estáticos deste repo
    # (nginx/tls/), não gerados pelo certbot, ver docker-compose.prod.yml.
    include /etc/nginx/tls/options-ssl-nginx.conf;
    ssl_dhparam /etc/nginx/tls/ssl-dhparams.pem;

    # HSTS: uma vez servido por HTTPS, o navegador nunca mais tenta HTTP
    # puro nesse domínio de novo, mesmo que o usuário digite http:// —
    # mitiga downgrade attack. max-age de 6 meses é um valor comum de
    # início (dá pra subir depois de confirmar que TLS está estável).
    add_header Strict-Transport-Security "max-age=15768000" always;

    client_max_body_size 5m;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # Cabeçalhos padrão de proxy reverso — a API nunca deve confiar
        # em X-Forwarded-For vindo direto do cliente (spoofável); aqui é
        # o nginx (ponto de confiança) que os define de verdade.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Necessário pro upgrade de conexão do WebSocket (GET /ws) — sem
        # isso o handshake nunca completa através do proxy.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
