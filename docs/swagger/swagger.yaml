    post:
      consumes:
      - application/json
      description: Cancela a NFC-e vinculada ao pagamento informado, junto à SEFAZ
        (integração direta, ver CLAUDE.md). Só permitido dentro do prazo regulamentar
        a partir da emissão — passado esse prazo a SEFAZ rejeita o evento, sem reenvio
        automático. Restrito a Caixa/Gestor/Admin Super.
      parameters:
      - description: id do payment
        in: path
        name: id
        required: true
        type: string
      - description: Justificativa do cancelamento (15-255 caracteres, exigido pela
          SEFAZ)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.cancelarNotaRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: justificativa inválida, nota não emitida, já cancelada, ou
            prazo de cancelamento expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: nenhuma nota fiscal encontrada pra esse pagamento
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cancelar NFC-e já emitida, dentro do prazo (US-22)
      tags:
      - pagamentos
