# Parâmetros de segurança TLS recomendados pelo certbot (versão estável,
# amplamente publicada — protocolos/cifras modernos, sem SSLv3/TLSv1.0/
# TLSv1.1). Comitado como arquivo estático (não é segredo — é
# configuração pública de cifras) pra não depender de rede durante o
# deploy nem de adivinhar nome de volume; ver docs/deploy.md.
ssl_session_cache shared:le_nginx_SSL:10m;
ssl_session_timeout 1440m;
ssl_session_tickets off;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;

ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA256";
