basePath: /
definitions:
  github_com_merka_api_internal_domain.AuditLogEntry:
    properties:
      acao:
        type: string
      comandaID:
        type: string
      criadoEm:
        type: string
      dados:
        additionalProperties: {}
        type: object
      id:
        type: string
      sucesso:
        type: boolean
      tenantID:
        type: string
      usuarioID:
        type: string
    type: object
  github_com_merka_api_internal_domain.Comanda:
    properties:
      abertaEm:
        type: string
      codigoFisico:
        type: string
      fechadaEm:
        type: string
      id:
        type: string
      status:
        $ref: '#/definitions/github_com_merka_api_internal_domain.StatusComanda'
      tableID:
        type: string
      tenantID:
        type: string
    type: object
  github_com_merka_api_internal_domain.Discount:
    properties:
      aplicadoEm:
        type: string
      aplicadoPor:
        type: string
      comandaID:
        type: string
      id:
        type: string
      motivo:
        type: string
      tenantID:
        type: string
      tipo:
        $ref: '#/definitions/github_com_merka_api_internal_domain.TipoDesconto'
      valor:
        format: float64
        type: number
    type: object
  github_com_merka_api_internal_domain.FiscalReceipt:
    properties:
      cancelada:
        type: boolean
      canceladaEm:
        type: string
      chaveAcesso:
        type: string
      documento:
        type: string
      emailDestino:
        type: string
      emailEnviado:
        type: boolean
      emitida:
        type: boolean
      emitidaEm:
        type: string
      id:
        type: string
      impressa:
        type: boolean
      linkDanfe:
        type: string
      modoEmissao:
        description: |-
          Campos de contingência offline (Passo 6 ETAPA B/C, tpEmis=9) —
          ModoEmissao é "normal" pra emissão online, ou um dos três estados de
          contingência (ver migrations/0018_fiscal_receipts_contingencia.sql).
          XMLAssinado só é preenchido pra notas em contingência — é o XML
          exato retransmitido pelo worker (ContingenciaWorker), nunca
          remontado.
        type: string
      motivoCancelamento:
        type: string
      motivoFalha:
        type: string
      numeroNota:
        type: string
      paymentID:
        type: string
      pdfgerado:
        type: boolean
      processadoEm:
        type: string
      protocoloAutorizacao:
        description: |-
          Campos de cancelamento (US-22) — ProtocoloAutorizacao é o nProt da
          emissão original, exigido pelo evento de cancelamento
          (detEvento/nProt); sem ele não é possível montar um cancelamento
          válido pra essa nota.
        type: string
      protocoloCancelamento:
        type: string
      tenantID:
        type: string
      tipoDocumento:
        type: string
      whatsappDestino:
        type: string
      whatsappEnviado:
        type: boolean
      xmlassinado:
        type: string
    type: object
  github_com_merka_api_internal_domain.OrderItem:
    properties:
      comandaID:
        type: string
      id:
        type: string
      lancadoEm:
        type: string
      lancadoPor:
        type: string
      motivoRemocao:
        type: string
      pesoKg:
        description: usado para itens de peso (peso líquido, já descontada a tara)
        format: float64
        type: number
      productID:
        type: string
      quantidade:
        description: usado para itens unitários
        format: float64
        type: number
      removidoEm:
        type: string
      removidoPor:
        description: |-
          Preenchidos só quando Status != ativo (US-10/US-12) — o lançamento
          original nunca é apagado, só marcado.
        type: string
      status:
        $ref: '#/definitions/github_com_merka_api_internal_domain.StatusOrderItem'
      tenantID:
        type: string
      valor:
        format: float64
        type: number
    type: object
  github_com_merka_api_internal_domain.Permissao:
    enum:
    - criar_usuario
    - criar_perfil
    - configurar_sistema
    - ver_auditoria
    - ver_relatorios
    - lancar_item
    - remover_item
    - registrar_peso
    - estornar_peso
    - transferir_mesa
    - aplicar_desconto
    - cancelar_comanda
    - processar_pagamento
    - entregar_comanda
    - cadastrar_produto
    - configurar_preco_peso
    - cancelar_nota_fiscal
    type: string
    x-enum-varnames:
    - PermissaoCriarUsuario
    - PermissaoCriarPerfil
    - PermissaoConfigurarSistema
    - PermissaoVerAuditoria
    - PermissaoVerRelatorios
    - PermissaoLancarItem
    - PermissaoRemoverItem
    - PermissaoRegistrarPeso
    - PermissaoEstornarPeso
    - PermissaoTransferirMesa
    - PermissaoAplicarDesconto
    - PermissaoCancelarComanda
    - PermissaoProcessarPagamento
    - PermissaoEntregarComanda
    - PermissaoCadastrarProduto
    - PermissaoConfigurarPrecoPeso
    - PermissaoCancelarNotaFiscal
  github_com_merka_api_internal_domain.PermissionCatalogo:
    properties:
      chave:
        $ref: '#/definitions/github_com_merka_api_internal_domain.Permissao'
      descricao:
        type: string
      id:
        type: string
    type: object
  github_com_merka_api_internal_domain.Product:
    properties:
      ativo:
        type: boolean
      categoryID:
        type: string
      cfop:
        type: string
      id:
        type: string
      ncm:
        description: |-
          NCM/CFOP: obrigatórios para emitir NFC-e via SEFAZ direta (ETAPA 4,
          ver CLAUDE.md) — nil em produtos cadastrados antes da migration
          0014. internal/fiscal.FiscalProviderSefazDireto recusa emitir nota
          com item sem esses dados em vez de estimar um valor.
        type: string
      nome:
        type: string
      precoPorKg:
        description: usado quando TipoCobranca == TipoCobrancaPeso
        format: float64
        type: number
      precoUnitario:
        description: usado quando TipoCobranca == TipoCobrancaUnitario
        format: float64
        type: number
      taraKg:
        description: peso do prato/recipiente, descontado do peso bruto lido na balança
        format: float64
        type: number
      tenantID:
        type: string
      tipoCobranca:
        $ref: '#/definitions/github_com_merka_api_internal_domain.TipoCobranca'
    type: object
  github_com_merka_api_internal_domain.RelatorioVendas:
    properties:
      fim:
        description: RFC3339 — fim do período (exclusive)
        type: string
      inicio:
        description: RFC3339 — início do período (inclusive)
        type: string
      periodo:
        type: string
      porFormaPagamento:
        items:
          $ref: '#/definitions/github_com_merka_api_internal_domain.VendaPorFormaPagamento'
        type: array
      porProduto:
        items:
          $ref: '#/definitions/github_com_merka_api_internal_domain.VendaPorProduto'
        type: array
      totalGeral:
        format: float64
        type: number
    type: object
  github_com_merka_api_internal_domain.Role:
    properties:
      id:
        type: string
      nome:
        type: string
      sistema:
        type: boolean
      tenantID:
        type: string
    type: object
  github_com_merka_api_internal_domain.StatusComanda:
    enum:
    - disponivel
    - em_uso
    - paga
    - cancelada
    type: string
    x-enum-varnames:
    - StatusDisponivel
    - StatusEmUso
    - StatusPaga
    - StatusCancelada
  github_com_merka_api_internal_domain.StatusOrderItem:
    enum:
    - ativo
    - removido
    - estornado
    type: string
    x-enum-varnames:
    - StatusItemAtivo
    - StatusItemRemovido
    - StatusItemEstornado
  github_com_merka_api_internal_domain.TipoCobranca:
    enum:
    - unitario
    - peso
    type: string
    x-enum-varnames:
    - TipoCobrancaUnitario
    - TipoCobrancaPeso
  github_com_merka_api_internal_domain.TipoDesconto:
    enum:
    - valor_fixo
    - percentual
    type: string
    x-enum-varnames:
    - DescontoValorFixo
    - DescontoPercentual
  github_com_merka_api_internal_domain.VendaPorFormaPagamento:
    properties:
      metodo:
        type: string
      total:
        format: float64
        type: number
    type: object
  github_com_merka_api_internal_domain.VendaPorProduto:
    properties:
      categoriaNome:
        type: string
      categoryID:
        type: string
      productID:
        type: string
      produtoNome:
        type: string
      total:
        format: float64
        type: number
    type: object
  internal_handler.abrirComandaRequest:
    properties:
      table_id:
        type: string
    type: object
  internal_handler.aplicarDescontoRequest:
    properties:
      motivo:
        type: string
      tipo:
        type: string
      valor:
        type: number
    type: object
  internal_handler.auditoriaResponse:
    properties:
      itens:
        items:
          $ref: '#/definitions/github_com_merka_api_internal_domain.AuditLogEntry'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  internal_handler.cadastrarProdutoRequest:
    properties:
      category_id:
        type: string
      nome:
        type: string
      preco_por_kg:
        type: number
      preco_unitario:
        type: number
      tara_kg:
        type: number
      tipo_cobranca:
        type: string
    type: object
  internal_handler.cancelarComandaRequest:
    properties:
      motivo:
        type: string
    type: object
  internal_handler.cancelarNotaRequest:
    properties:
      justificativa:
        type: string
    type: object
  internal_handler.configurarPrecoPesoRequest:
    properties:
      preco_por_kg:
        type: number
      tara_kg:
        type: number
    type: object
  internal_handler.criarPerfilRequest:
    properties:
      nome:
        type: string
      permissoes:
        items:
          type: string
        type: array
    type: object
  internal_handler.criarUsuarioRequest:
    properties:
      login:
        type: string
      nome:
        type: string
      role_id:
        type: string
      senha:
        type: string
    type: object
  internal_handler.editarPermissoesPerfilRequest:
    properties:
      permissoes:
        items:
          type: string
        type: array
    type: object
  internal_handler.fecharPagamentoRequest:
    properties:
      comanda_ids:
        items:
          type: string
        type: array
      pagamentos:
        items:
          $ref: '#/definitions/internal_handler.pagamentoParcialRequest'
        type: array
    type: object
  internal_handler.fecharPagamentoResponse:
    properties:
      payment_ids:
        items:
          type: string
        type: array
    type: object
  internal_handler.lancarItemRequest:
    properties:
      product_id:
        type: string
      quantidade:
        type: number
    type: object
  internal_handler.loginRequest:
    properties:
      login:
        type: string
      senha:
        type: string
    type: object
  internal_handler.loginResponse:
    properties:
      token:
        type: string
    type: object
  internal_handler.mesaResponse:
    properties:
      codigo_fisico:
        type: string
      comanda_id:
        type: string
      id:
        type: string
      identificador:
        type: string
    type: object
  internal_handler.motivoRequest:
    properties:
      motivo:
        type: string
    type: object
  internal_handler.notasFiscaisResponse:
    properties:
      itens:
        items:
          $ref: '#/definitions/github_com_merka_api_internal_domain.FiscalReceipt'
        type: array
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  internal_handler.pagamentoParcialRequest:
    properties:
      metodo:
        type: string
      valor:
        type: number
    type: object
  internal_handler.registrarPesoRequest:
    properties:
      peso_bruto:
        type: number
      product_id:
        type: string
    type: object
  internal_handler.transferirMesaRequest:
    properties:
      table_id:
        type: string
    type: object
  internal_handler.usuarioResponse:
    properties:
      ativo:
        type: boolean
      id:
        type: string
      login:
        type: string
      nome:
        type: string
      role_id:
        type: string
    type: object
info:
  contact: {}
  description: Sistema de comandas multi-tenant (churrascaria como primeira instância).
    Ver CLAUDE.md e docs/merka-planejamento.md para o contexto completo do domínio.
  title: Merka API
  version: "1.0"
paths:
  /auditoria:
    get:
      description: 'Restrito a Admin Super ou Gestor (permissão "ver_auditoria").
        Filtros opcionais via querystring: usuario_id, acao, comanda_id, data_inicio,
        data_fim (RFC3339 ou "AAAA-MM-DD"). Paginação simples via limit (padrão 50,
        máx 200) e offset.'
      parameters:
      - description: Filtrar por usuário
        in: query
        name: usuario_id
        type: string
      - description: 'Filtrar por ação (ex: lancar_item, cancelar_comanda)'
        in: query
        name: acao
        type: string
      - description: Filtrar por comanda
        in: query
        name: comanda_id
        type: string
      - description: Data/hora inicial (RFC3339 ou AAAA-MM-DD)
        in: query
        name: data_inicio
        type: string
      - description: Data/hora final (RFC3339 ou AAAA-MM-DD)
        in: query
        name: data_fim
        type: string
      - description: Itens por página (padrão 50, máx 200)
        in: query
        name: limit
        type: integer
      - description: Deslocamento da página (padrão 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.auditoriaResponse'
        "400":
          description: parâmetro inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: usuário sem permissão para esta ação
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Consultar log de auditoria (US-03)
      tags:
      - auditoria
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Valida login/senha e devolve um JWT contendo user_id, tenant_id
        e role_id, usado nas demais rotas via header Authorization: Bearer <token>.'
      parameters:
      - description: Credenciais
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.loginResponse'
        "400":
          description: corpo da requisição inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: login ou senha inválidos
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Autenticar usuário
      tags:
      - auth
  /comandas/{codigo}:
    get:
      description: Só leitura, sem auditoria (não muda estado nenhum) — usado pelo
        Porteiro (US-07/US-08) pra decidir sozinho, a partir do status devolvido,
        se a próxima chamada é POST /abrir ou POST /liberar. O porteiro só escaneia;
        quem escolhe a ação é o sistema.
      parameters:
      - description: Código físico da comanda (código de barras/QR)
        in: path
        name: codigo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_merka_api_internal_domain.Comanda'
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: comanda não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Consultar status de uma comanda pelo código físico
      tags:
      - comandas
  /comandas/{codigo}/abrir:
    post:
      consumes:
      - application/json
      description: 'Porteiro escaneia/seleciona a comanda física e o sistema a marca
        como "em_uso", associando-a opcionalmente a uma mesa. Falha se a comanda não
        estiver com status "disponivel". Requer autenticação (Authorization: Bearer
        <token>).'
      parameters:
      - description: Código físico da comanda (código de barras/QR)
        in: path
        name: codigo
        required: true
        type: string
      - description: Mesa a associar à comanda (opcional)
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_handler.abrirComandaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_merka_api_internal_domain.Comanda'
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: comanda não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: comanda não está disponível (em uso, paga ou cancelada)
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Entregar comanda zerada ao cliente (US-07)
      tags:
      - comandas
  /comandas/{codigo}/liberar:
    post:
      description: Porteiro escaneia a comanda na saída; se estiver paga (sem saldo
        devedor), o sistema libera de volta pro estoque (status volta a "disponivel").
        Se ainda tiver saldo pendente, bloqueia com erro claro.
      parameters:
      - description: Código físico da comanda
        in: path
        name: codigo
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_merka_api_internal_domain.Comanda'
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: comanda não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: comanda ainda não foi paga
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Receber comanda na saída e validar zeramento (US-08)
      tags:
      - comandas
  /comandas/{id}/cancelar:
    post:
      consumes:
      - application/json
      description: Restrito a Gestor/Admin Super (permissão "cancelar_comanda"). Zera
        todos os itens/pesos lançados (marcados como removidos, nunca apagados), marca
        a comanda como cancelada e a libera de volta pro estoque. Exige motivo.
      parameters:
      - description: ID da comanda
        in: path
        name: id
        required: true
        type: string
      - description: Motivo do cancelamento
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.cancelarComandaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_merka_api_internal_domain.Comanda'
        "400":
          description: motivo obrigatório
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: usuário sem permissão para esta ação
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: comanda não encontrada
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: comanda não está em uso
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cancelar comanda totalmente (US-15)
      tags:
      - comandas
  /comandas/{id}/desconto:
    post:
      consumes:
      - application/json
      description: Restrito a Gestor, Admin Super ou Caixa (permissão "aplicar_desconto").
        Tipo "valor_fixo" ou "percentual", sempre com motivo — bloqueia se o desconto
        resultar em total negativo.
      parameters:
      - description: ID da comanda
        in: path
        name: id
        required: true
        type: string
      - description: Tipo, valor e motivo do desconto
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.aplicarDescontoRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_merka_api_internal_domain.Discount'
        "400":
          description: motivo obrigatório ou tipo inválido
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: usuário sem permissão para esta ação
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: desconto resultaria em valor negativo
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: erro interno
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Aplicar desconto manual (US-17)
      tags:
      - comandas
  /comandas/{id}/itens:
    get:
      description: 'Lista todos os order_items da comanda, todo status (inclusive
        removido/estornado, por transparência) — usado pelo Garçom pra mostrar o lançamento
        completo e o total parcial. Sem checagem de permissão granular: qualquer perfil
        autenticado pode consultar.'
      parameters:
      - description: ID da comanda
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_merka_api_internal_domain.OrderItem'
            type: array
        "401":
          description: token ausente, inválido ou expirado
          schema:
            additionalProperties:
              type: string
